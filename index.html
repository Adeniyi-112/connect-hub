<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONNECT HUB</title>

<style>
  <style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080d1b;
  --surface:#111a2e;
  --surface2:#17233b;
  --purple:#8157ff;
  --cyan:#21d4fd;
  --coral:#ff718b;
  --text:#f4f6ff;
  --muted:#9ba8c2;
  --border:#293650;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:linear-gradient(110deg,#17102f,#142c49);
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:5;
  border-bottom:1px solid var(--border);
}

header h2{
  font-size:22px;
  letter-spacing:1px;
  background:linear-gradient(90deg,var(--cyan),#b69aff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  background:linear-gradient(110deg,var(--purple),#5942d8);
  color:white;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  filter:brightness(1.12);
}

input,textarea{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0b1427;
  color:white;
  font:inherit;
  outline:none;
}

input:focus,textarea:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 2px #21d4fd22;
}

input::placeholder,textarea::placeholder{
  color:#8492ad;
}

textarea{
  resize:vertical;
}

.auth{
  max-width:420px;
  margin:50px auto;
  background:var(--surface);
  padding:28px;
  border-radius:20px;
  border:1px solid var(--border);
  box-shadow:0 15px 45px #0006;
}

.auth h2{
  text-align:center;
  margin-bottom:15px;
  font-size:25px;
}

.auth button{
  width:100%;
  margin-top:10px;
}

.google{
  background:linear-gradient(110deg,#263b59,#344e70);
}

.hidden{
  display:none!important;
}

nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  background:#10192b;
  position:sticky;
  top:61px;
  z-index:4;
  border-bottom:1px solid var(--border);
  scrollbar-width:thin;
}

nav button{
  white-space:nowrap;
  font-size:12px;
  background:var(--surface2);
  border:1px solid var(--border);
}

nav button:hover{
  background:var(--purple);
}

main{
  max-width:850px;
  margin:25px auto;
  padding:0 14px;
}

.card{
  background:var(--surface);
  padding:20px;
  border-radius:17px;
  margin-bottom:17px;
  border:1px solid var(--border);
  box-shadow:0 8px 25px #0003;
}

.card h3{
  margin-bottom:13px;
  font-size:19px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.row{
  display:flex;
  gap:12px;
  align-items:center;
}

.row button{
  white-space:nowrap;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  color:white;
  display:grid;
  place-items:center;
  font-weight:bold;
  flex-shrink:0;
}

.post{
  line-height:1.7;
  white-space:pre-wrap;
  margin:15px 0;
  color:#e5eaff;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:12px;
}

.actions button{
  font-size:12px;
  background:var(--surface2);
  border:1px solid var(--border);
}

.actions button:hover{
  background:var(--purple);
}

.item{
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.item:last-child{
  border-bottom:0;
}

#messages{
  height:350px;
  overflow-y:auto;
  background:#091326;
  padding:14px;
  border-radius:13px;
  margin:15px 0;
  border:1px solid var(--border);
}

.message{
  background:#202e49;
  color:white;
  padding:11px 14px;
  border-radius:13px 13px 13px 3px;
  margin:9px 0;
  max-width:85%;
  overflow-wrap:anywhere;
}

.mine{
  background:linear-gradient(120deg,#6748d9,#4058c9);
  margin-left:auto;
  border-radius:13px 13px 3px 13px;
}

small{
  color:var(--muted);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:25px;
  font-size:12px;
  border-top:1px solid var(--border);
  margin-top:30px;
}

@media(max-width:600px){
  header{
    padding:15px;
  }

  header h2{
    font-size:19px;
  }

  nav{
    top:53px;
    gap:6px;
    padding:10px;
  }

  nav button{
    padding:10px 13px;
  }

  main{
    margin:17px auto;
    padding:0 10px;
  }

  .card{
    padding:15px;
    border-radius:14px;
  }

  .auth{
    margin:25px 13px;
    padding:22px;
  }

  #messages{
    height:300px;
  }
}
</style>
</head>

<body>

<header>
<h2>CONNECT HUB</h2>
<button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</header>

<section id="authSection" class="auth">
<h2>Welcome to CONNECT HUB</h2>
<p class="muted" style="text-align:center">Connect with people around the world.</p>
<input id="nameInput" placeholder="Full name">
<input id="emailInput" type="email" placeholder="Email address">
<input id="passwordInput" type="password" placeholder="Password">
<button onclick="register()">Create account</button>
<button onclick="login()">Login</button>
<button class="google" onclick="googleLogin()">Continue with Google</button>
<p id="authMessage" class="muted" style="margin-top:12px;text-align:center"></p>
</section>

<div id="app" class="hidden">

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('discover')">Discover</button>
<button onclick="showPage('requests')">Requests</button>
<button onclick="showPage('friends')">Friends</button>
<button onclick="showPage('chats')">Chats</button>
<button onclick="showPage('communities')">Communities</button>
<button onclick="showPage('profile')">Profile</button>
<button onclick="showPage('notifications')">Notifications</button>
</nav>

<main>

<section id="homePage" class="page">
<div class="card">
<h3>What's happening?</h3>
<textarea id="postInput" maxlength="2000" placeholder="Share something with everyone..."></textarea>
<button onclick="createPost()">Publish Post</button>
</div>
<div id="feed"></div>
</section>

<section id="discoverPage" class="page hidden">
<div class="card">
<h3>Discover People</h3>
<input id="searchInput" placeholder="Search names or usernames..." oninput="searchPeople()">
<div id="peopleList"></div>
</div>
</section>

<section id="requestsPage" class="page hidden">
<div class="card">
<h3>Friend Requests</h3>
<div id="requestList"></div>
</div>
</section>

<section id="friendsPage" class="page hidden">
<div class="card">
<h3>My Friends</h3>
<div id="friendsList"></div>
</div>
</section>

<section id="chatsPage" class="page hidden">
<div class="card">
<h3>My Chats</h3>
<div id="chatContacts"></div>
</div>
</section>

<section id="chatPage" class="page hidden">
<div class="card">
<button onclick="showPage('chats')">Back to Chats</button>
<h3 id="chatTitle" style="margin-top:15px">Private Chat</h3>
<div id="messages"></div>
<textarea id="messageInput" maxlength="2000" placeholder="Write a message..."></textarea>
<button onclick="sendMessage()">Send Message</button>
</div>
</section>

<section id="communitiesPage" class="page hidden">
<div class="card">
<h3>Create a Community</h3>
<input id="communityName" maxlength="50" placeholder="Community name">
<input id="communityDescription" maxlength="200" placeholder="Description">
<button onclick="createCommunity()">Create Community</button>
</div>
<div class="card">
<h3>Explore Communities</h3>
<div id="communityList"></div>
</div>
</section>

<section id="profilePage" class="page hidden">
<div class="card">
<h3>My Profile</h3>
<input id="profileName" placeholder="Your name">
<input id="profileUsername" placeholder="Username">
<textarea id="profileBio" maxlength="300" placeholder="Tell people about yourself"></textarea>
<button onclick="saveProfile()">Save Profile</button>
<p id="profileEmail" class="muted"></p>
</div>
</section>

<section id="notificationsPage" class="page hidden">
<div class="card">
<h3>Notifications</h3>
<div id="notificationList"></div>
</div>
</section>

</main>
</div>

<footer>CONNECT HUB · Connecting people worldwide</footer>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,GoogleAuthProvider,
signInWithPopup,onAuthStateChanged,signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
getFirestore,collection,doc,setDoc,getDoc,
getDocs,addDoc,deleteDoc,updateDoc,query,
where,orderBy,onSnapshot,serverTimestamp,limit
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAMO8O4vh1nkKxxS2J1-EYtHCw0Sxg51Vk",
authDomain:"connect-hub-d183a.firebaseapp.com",
projectId:"connect-hub-d183a",
storageBucket:"connect-hub-d183a.firebasestorage.app",
messagingSenderId:"175835875152",
appId:"1:175835875152:web:5eece1581716a2854cce55",
measurementId:"G-HL4HPENGCT"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

let currentUser=null;
let activeChat=null;
let stopMessages=null;
let allPeople=[];
let allFriends=[];

const $=id=>document.getElementById(id);
const pairId=(a,b)=>[a,b].sort().join("_");

function safe(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function authMessage(text){
$("authMessage").textContent=text;
}

async function createUserProfile(user,name){
const ref=doc(db,"users",user.uid);
const snap=await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
uid:user.uid,
displayName:name||user.displayName||"New Member",
username:"user_"+user.uid.slice(0,7),
email:user.email||"",
bio:"",
createdAt:serverTimestamp()
});
}
}

// AUTHENTICATION

window.register=async()=>{
const name=$("nameInput").value.trim();
const email=$("emailInput").value.trim();
const password=$("passwordInput").value;

if(!name||!email||password.length<6){
authMessage("Enter your name, email and a password of at least 6 characters.");
return;
}

try{
const result=await createUserWithEmailAndPassword(auth,email,password);
await updateProfile(result.user,{displayName:name});
await createUserProfile(result.user,name);
}catch(e){authMessage(e.message);}
};

window.login=async()=>{
try{
await signInWithEmailAndPassword(
auth,$("emailInput").value.trim(),$("passwordInput").value
);
}catch(e){authMessage(e.message);}
};

window.googleLogin=async()=>{
try{
const result=await signInWithPopup(auth,provider);
await createUserProfile(result.user,result.user.displayName);
}catch(e){authMessage(e.message);}
};

window.logout=async()=>{
if(stopMessages)stopMessages();
stopMessages=null;
activeChat=null;
await signOut(auth);
};

onAuthStateChanged(auth,async user=>{
currentUser=user;
$("authSection").classList.toggle("hidden",!!user);
$("app").classList.toggle("hidden",!user);
$("logoutBtn").classList.toggle("hidden",!user);

if(user){
try{
await createUserProfile(user,user.displayName);
await loadProfile();
await loadFeed();
showPage("home");
}catch(e){alert("Account loading error: "+e.message);}
}else{
if(stopMessages)stopMessages();
stopMessages=null;
activeChat=null;
}
});

// NAVIGATION

window.showPage=page=>{
document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
$(page+"Page").classList.remove("hidden");

if(page!=="chat"&&stopMessages){
stopMessages();
stopMessages=null;
}

if(page==="home")loadFeed();
if(page==="discover")loadPeople();
if(page==="requests")loadRequests();
if(page==="friends")loadFriends();
if(page==="chats")loadChatContacts();
if(page==="communities")loadCommunities();
if(page==="profile")loadProfile();
if(page==="notifications")loadNotifications();
};

// PROFILE

async function loadProfile(){
const snap=await getDoc(doc(db,"users",currentUser.uid));
const d=snap.data()||{};
$("profileName").value=d.displayName||"";
$("profileUsername").value=d.username||"";
$("profileBio").value=d.bio||"";
$("profileEmail").textContent=currentUser.email||"";
}

window.saveProfile=async()=>{
const name=$("profileName").value.trim();
const username=$("profileUsername").value.trim().replace(/^@/,"").toLowerCase();
const bio=$("profileBio").value.trim();

if(!name||!/^[a-z0-9_]{3,20}$/.test(username)){
alert("Enter a name and a username of 3–20 letters, numbers or underscores.");
return;
}

try{
const users=await getDocs(collection(db,"users"));
const taken=users.docs.some(d=>
d.id!==currentUser.uid&&
(d.data().username||"").toLowerCase()===username
);

if(taken)return alert("That username is already taken.");

await updateDoc(doc(db,"users",currentUser.uid),{
displayName:name,username,bio
});
await updateProfile(currentUser,{displayName:name});
alert("Profile updated!");
}catch(e){alert(e.message);}
};

// POSTS

window.createPost=async()=>{
const text=$("postInput").value.trim();
if(!text)return;

try{
await addDoc(collection(db,"posts"),{
uid:currentUser.uid,text,createdAt:serverTimestamp()
});
$("postInput").value="";
loadFeed();
}catch(e){alert(e.message);}
};

async function loadFeed(){
const box=$("feed");
box.innerHTML='<p class="empty">Loading posts...</p>';

try{
const snap=await getDocs(query(
collection(db,"posts"),
orderBy("createdAt","desc"),limit(50)
));

box.innerHTML="";

for(const post of snap.docs){
const d=post.data();
const p=await getDoc(doc(db,"users",d.uid));
const person=p.data()||{};
const likes=await getDocs(collection(db,"posts",post.id,"likes"));

const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<div class="row">
<div class="avatar">${safe((person.displayName||"U")[0].toUpperCase())}</div>
<div><b>${safe(person.displayName||"Member")}</b><br>
<small>@${safe(person.username||"member")}</small></div>
</div>
<div class="post">${safe(d.text)}</div>
<div class="actions">
<button class="like">Like (${likes.size})</button>
<button class="comment">Comments</button>
${d.uid===currentUser.uid?'<button class="delete">Delete</button>':''}
</div>
<div class="comments hidden"></div>`;

card.querySelector(".like").onclick=()=>toggleLike(post.id);
card.querySelector(".comment").onclick=()=>showComments(post.id,card.querySelector(".comments"));

if(d.uid===currentUser.uid){
card.querySelector(".delete").onclick=async()=>{
if(confirm("Delete this post?")){
await deleteDoc(doc(db,"posts",post.id));
loadFeed();
}
};
}

box.appendChild(card);
}

if(!snap.size)box.innerHTML='<p class="empty">No posts yet. Be the first to share!</p>';

}catch(e){
box.innerHTML='<p class="empty">Could not load posts: '+safe(e.message)+'</p>';
}
}

async function toggleLike(postId){
const ref=doc(db,"posts",postId,"likes",currentUser.uid);
const snap=await getDoc(ref);

if(snap.exists())await deleteDoc(ref);
else await setDoc(ref,{uid:currentUser.uid,createdAt:serverTimestamp()});

loadFeed();
}

async function showComments(postId,box){
box.classList.toggle("hidden");
if(box.classList.contains("hidden"))return;

const snap=await getDocs(query(
collection(db,"posts",postId,"comments"),
orderBy("createdAt","asc")
));

box.innerHTML=`
<input class="commentInput" maxlength="1000" placeholder="Write a comment...">
<button class="addComment">Send Comment</button>`;

for(const c of snap.docs){
const d=c.data();
const p=await getDoc(doc(db,"users",d.uid));
const line=document.createElement("p");
line.style.marginTop="8px";
line.textContent=(p.data()?.displayName||"Member")+": "+d.text;
box.appendChild(line);
}

box.querySelector(".addComment").onclick=async()=>{
const text=box.querySelector(".commentInput").value.trim();
if(!text)return;

await addDoc(collection(db,"posts",postId,"comments"),{
uid:currentUser.uid,text,createdAt:serverTimestamp()
});
showComments(postId,box);
};
}

// DISCOVER

async function loadPeople(){
const snap=await getDocs(collection(db,"users"));
allPeople=snap.docs.map(d=>d.data()).filter(p=>p.uid!==currentUser.uid);
renderPeople(allPeople);
}

window.searchPeople=()=>{
const term=$("searchInput").value.toLowerCase().trim();
renderPeople(allPeople.filter(p=>
(p.displayName||"").toLowerCase().includes(term)||
(p.username||"").toLowerCase().includes(term)
));
};

function renderPeople(people){
const box=$("peopleList");
box.innerHTML="";

if(!people.length){
box.innerHTML='<p class="empty">No people found.</p>';
return;
}

people.forEach(p=>{
const item=document.createElement("div");
item.className="item";
item.innerHTML=`
<div class="row">
<div class="avatar">${safe((p.displayName||"U")[0].toUpperCase())}</div>
<div style="flex:1"><b>${safe(p.displayName)}</b><br>
<small>@${safe(p.username||"member")}</small></div>
<button>Connect</button>
</div>`;

item.querySelector("button").onclick=()=>sendRequest(p.uid);
box.appendChild(item);
});
}

// FRIEND REQUESTS

window.sendRequest=async receiverUid=>{
const id=currentUser.uid+"_"+receiverUid;

try{
await setDoc(doc(db,"friendRequests",id),{
senderUid:currentUser.uid,
receiverUid,
status:"pending",
createdAt:serverTimestamp()
});
alert("Friend request sent!");
}catch(e){
if(e.code==="permission-denied"){
alert("A request may already exist, or this action is not allowed.");
}else{
alert(e.message);
}
}
};

async function loadRequests(){
const box=$("requestList");
box.innerHTML="Loading...";

try{
const snap=await getDocs(query(
collection(db,"friendRequests"),
where("receiverUid","==",currentUser.uid),
where("status","==","pending")
));

box.innerHTML="";

for(const r of snap.docs){
const d=r.data();
const p=await getDoc(doc(db,"users",d.senderUid));
const person=p.data()||{};

const item=document.createElement("div");
item.className="item";
item.innerHTML=`
<b>${safe(person.displayName||"Member")}</b>
<div class="actions" style="margin-top:8px">
<button class="accept">Accept</button>
<button class="decline">Decline</button>
</div>`;

item.querySelector(".accept").onclick=async()=>{
try{
await updateDoc(doc(db,"friendRequests",r.id),{status:"accepted"});
loadRequests();
}catch(e){alert(e.message);}
};

item.querySelector(".decline").onclick=async()=>{
try{
await deleteDoc(doc(db,"friendRequests",r.id));
loadRequests();
}catch(e){alert(e.message);}
};

box.appendChild(item);
}

if(!snap.size)box.innerHTML='<p class="empty">No pending requests.</p>';
}catch(e){box.textContent="Could not load requests: "+e.message;}
}

// FRIENDS
// Use two constrained queries so Firestore rules can verify access.

async function getMyFriends(){
const a=await getDocs(query(
collection(db,"friendRequests"),
where("senderUid","==",currentUser.uid),
where("status","==","accepted")
));

const b=await getDocs(query(
collection(db,"friendRequests"),
where("receiverUid","==",currentUser.uid),
where("status","==","accepted")
));

const ids=[
...a.docs.map(d=>d.data().receiverUid),
...b.docs.map(d=>d.data().senderUid)
];

return [...new Set(ids)];
}

async function loadFriends(){
const box=$("friendsList");
box.innerHTML="Loading...";

try{
const ids=await getMyFriends();
allFriends=[];

for(const uid of ids){
const p=await getDoc(doc(db,"users",uid));
if(p.exists())allFriends.push(p.data());
}

box.innerHTML="";

allFriends.forEach(p=>{
const item=document.createElement("div");
item.className="item";
item.innerHTML=`
<div class="row">
<b style="flex:1">${safe(p.displayName)}</b>
<button>Chat</button>
</div>`;
item.querySelector("button").onclick=()=>startChat(p.uid,p.displayName);
box.appendChild(item);
});

if(!ids.length)box.innerHTML='<p class="empty">You have no friends yet. Discover people to connect!</p>';

}catch(e){box.textContent="Could not load friends: "+e.message;}
}

// CHATS

async function loadChatContacts(){
const box=$("chatContacts");
box.innerHTML="Loading...";

try{
const ids=await getMyFriends();
box.innerHTML="";

for(const uid of ids){
const p=await getDoc(doc(db,"users",uid));
if(!p.exists())continue;

const person=p.data();
const item=document.createElement("div");
item.className="item";
item.innerHTML=`
<div class="row">
<b style="flex:1">${safe(person.displayName)}</b>
<button>Open Chat</button>
</div>`;
item.querySelector("button").onclick=()=>startChat(uid,person.displayName);
box.appendChild(item);
}

if(!ids.length)box.innerHTML='<p class="empty">Add friends before starting a chat.</p>';

}catch(e){box.textContent="Could not load chats: "+e.message;}
}

window.startChat=async(otherUid,name)=>{
try{
const participants=[currentUser.uid,otherUid].sort();
const chatId=pairId(currentUser.uid,otherUid);
const ref=doc(db,"chats",chatId);

// Create the chat directly. Do not read a missing chat first.
await setDoc(ref,{
participants,
createdAt:serverTimestamp()
},{merge:true});

activeChat=chatId;
$("chatTitle").textContent="Chat with "+name;
showPage("chat");

if(stopMessages)stopMessages();

stopMessages=onSnapshot(query(
collection(db,"chats",chatId,"messages"),
orderBy("createdAt","asc")
),snap=>{
const box=$("messages");
box.innerHTML="";

snap.forEach(m=>{
const d=m.data();
const div=document.createElement("div");
div.className="message "+(d.senderUid===currentUser.uid?"mine":"");
div.textContent=d.text;
box.appendChild(div);
});

box.scrollTop=box.scrollHeight;
},error=>{
alert("Chat error: "+error.message);
});

}catch(e){alert("Could not open chat: "+e.message);}
};

window.sendMessage=async()=>{
const text=$("messageInput").value.trim();
if(!text||!activeChat)return;

try{
await addDoc(collection(db,"chats",activeChat,"messages"),{
senderUid:currentUser.uid,
text,
createdAt:serverTimestamp()
});
$("messageInput").value="";
}catch(e){alert("Message could not be sent: "+e.message);}
};

// COMMUNITIES

async function loadCommunities(){
const box=$("communityList");
box.innerHTML="Loading...";

try{
const snap=await getDocs(collection(db,"communities"));
box.innerHTML="";

for(const c of snap.docs){
const d=c.data();
const item=document.createElement("div");
item.className="item";
item.innerHTML=`
<b>${safe(d.name)}</b>
<p class="muted">${safe(d.description||"")}</p>
<button>Join Community</button>`;

item.querySelector("button").onclick=async()=>{
try{
await setDoc(doc(db,"communities",c.id,"members",currentUser.uid),{
uid:currentUser.uid,joinedAt:serverTimestamp()
});
alert("You joined the community!");
}catch(e){alert(e.message);}
};

box.appendChild(item);
}

if(!snap.size)box.innerHTML='<p class="empty">No communities yet. Create one!</p>';

}catch(e){box.textContent="Could not load communities: "+e.message;}
}

window.createCommunity=async()=>{
const name=$("communityName").value.trim();
const description=$("communityDescription").value.trim();

if(!name)return alert("Enter a community name.");

try{
await addDoc(collection(db,"communities"),{
name,description,ownerUid:currentUser.uid,createdAt:serverTimestamp()
});
$("communityName").value="";
$("communityDescription").value="";
loadCommunities();
}catch(e){alert(e.message);}
};

// NOTIFICATIONS

async function loadNotifications(){
const box=$("notificationList");
box.innerHTML="Loading...";

try{
const snap=await getDocs(query(
collection(db,"friendRequests"),
where("receiverUid","==",currentUser.uid),
orderBy("createdAt","desc"),
limit(30)
));

box.innerHTML="";

for(const r of snap.docs){
const d=r.data();
const p=await getDoc(doc(db,"users",d.senderUid));
const name=p.data()?.displayName||"Someone";

const item=document.createElement("div");
item.className="item";
item.textContent=name+" sent you a friend request. Status: "+d.status;
box.appendChild(item);
}

if(!snap.size)box.innerHTML='<p class="empty">No notifications yet.</p>';

}catch(e){box.textContent="Could not load notifications: "+e.message;}
}

</script>
