<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1b">
<title>CONNECT HUB</title>
<style>
:root{--bg:#080d1b;--surface:#111a2e;--surface2:#17233b;--purple:#8157ff;--cyan:#21d4fd;--text:#f4f6ff;--muted:#9ba8c2;--border:#293650}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(110deg,#17102f,#142c49);padding:15px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
header h2{font-size:21px;letter-spacing:1px;color:var(--cyan)}
button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(110deg,var(--purple),#5942d8);color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid var(--border);border-radius:10px;background:#0b1427;color:white;font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--cyan)}
textarea{resize:vertical;min-height:75px}
.auth{max-width:460px;margin:30px auto;background:var(--surface);padding:24px;border-radius:18px;border:1px solid var(--border)}
.auth h2{text-align:center;margin-bottom:12px}
.auth button{width:100%;margin-top:9px}
.google{background:#263b59}
.hidden{display:none!important}
nav{display:flex;gap:7px;overflow-x:auto;padding:11px;background:#10192b;position:sticky;top:55px;z-index:5;border-bottom:1px solid var(--border)}
nav button{white-space:nowrap;font-size:12px;background:var(--surface2);border:1px solid var(--border);padding:10px 12px}
main{max-width:850px;margin:22px auto;padding:0 13px}
.card{background:var(--surface);padding:18px;border-radius:16px;margin-bottom:15px;border:1px solid var(--border);box-shadow:0 8px 25px #0003}
.card h3{margin-bottom:12px}
.muted,small{color:var(--muted);font-size:13px}
.row{display:flex;gap:11px;align-items:center}
.row>div:nth-child(2){flex:1}
.avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-weight:bold}
.avatar img{width:100%;height:100%;object-fit:cover}
.item{padding:13px 0;border-bottom:1px solid var(--border)}
.item:last-child{border:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button,.secondary{background:var(--surface2);border:1px solid var(--border);font-size:12px}
.post{white-space:pre-wrap;line-height:1.6;margin:14px 0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
#messages{height:340px;overflow:auto;background:#091326;padding:12px;border-radius:12px;margin:12px 0;border:1px solid var(--border)}
.message{background:#202e49;padding:10px 13px;border-radius:13px;margin:8px 0;max-width:85%;overflow-wrap:anywhere}
.mine{background:linear-gradient(120deg,#6748d9,#4058c9);margin-left:auto}
.profile-photo{width:90px;height:90px;border-radius:22px;object-fit:cover;border:2px solid var(--cyan);margin:10px 0}
footer{text-align:center;color:var(--muted);padding:25px;font-size:12px}
@media(max-width:600px){
header h2{font-size:19px}
nav{top:53px}
main{margin:15px auto;padding:0 10px}
.card{padding:14px}
.auth{margin:20px 12px;padding:20px}
#messages{height:290px}
}
</style>
</head>
<body>

<header>
<h2>CONNECT HUB</h2>
<button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</header>

<section id="authSection" class="auth">
<h2>Welcome to CONNECT HUB</h2>
<p class="muted" style="text-align:center">Connect with people around the world.</p>
<div id="registerFields">
<input id="nameInput" placeholder="Full name">
<input id="usernameInput" placeholder="Choose username">
<input id="phoneInput" placeholder="Phone number">
</div>
<input id="emailInput" type="email" placeholder="Email address">
<input id="passwordInput" type="password" placeholder="Password">
<label class="muted">Profile picture (optional)</label>
<input id="photoInput" type="file" accept="image/*">
<button onclick="register()">Create account</button>
<button class="secondary" onclick="login()">Login</button>
<button class="google" onclick="googleLogin()">Continue with Google</button>
<p id="authMessage" class="muted" style="margin-top:12px;text-align:center"></p>
</section>

<div id="app" class="hidden">
<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('discover')">Discover</button>
<button onclick="showPage('requests')">Requests</button>
<button onclick="showPage('friends')">Friends</button>
<button onclick="showPage('chats')">Chats</button>
<button onclick="showPage('communities')">Communities</button>
<button onclick="showPage('profile')">Profile</button>
<button onclick="showPage('notifications')">Notifications</button>
</nav>

<main>

<section id="homePage" class="page">
<div class="card">
<h3>What's happening?</h3>
<textarea id="postInput" maxlength="2000" placeholder="Share something with everyone..."></textarea>
<button onclick="createPost()">Publish Post</button>
</div>
<div id="feed"></div>
</section>

<section id="discoverPage" class="page hidden">
<div class="card">
<h3>Discover People</h3>
<input id="searchInput" placeholder="Search names or usernames..." oninput="searchPeople()">
<div id="peopleList"></div>
</div>
</section>

<section id="requestsPage" class="page hidden">
<div class="card">
<h3>Friend Requests</h3>
<div id="requestList"></div>
</div>
</section>

<section id="friendsPage" class="page hidden">
<div class="card">
<h3>My Friends</h3>
<div id="friendsList"></div>
</div>
</section>

<section id="chatsPage" class="page hidden">
<div class="card">
<h3>My Chats</h3>
<div id="chatContacts"></div>
</div>
</section>

<section id="chatPage" class="page hidden">
<div class="card">
<button class="secondary" onclick="showPage('chats')">← Chats</button>
<h3 id="chatTitle" style="margin-top:14px">Private Chat</h3>
<div id="messages"></div>
<textarea id="messageInput" maxlength="2000" placeholder="Write a message..."></textarea>
<button onclick="sendMessage()">Send Message</button>
</div>
</section>

<section id="communitiesPage" class="page hidden">
<div class="card">
<h3>Create a Community</h3>
<input id="communityName" maxlength="50" placeholder="Community name">
<input id="communityDescription" maxlength="200" placeholder="Description">
<button onclick="createCommunity()">Create Community</button>
</div>
<div class="card">
<h3>Explore Communities</h3>
<div id="communityList"></div>
</div>
</section>

<section id="communityPage" class="page hidden">
<div class="card">
<button class="secondary" onclick="showPage('communities')">← Communities</button>
<h3 id="communityTitle" style="margin-top:12px"></h3>
<p id="communityAbout" class="muted"></p>
<div id="communityControls" class="actions"></div>
</div>
<div id="communityPosts"></div>
<div class="card" id="communityComposer">
<textarea id="communityPostInput" maxlength="1500" placeholder="Write to this community..."></textarea>
<button onclick="sendCommunityPost()">Post</button>
</div>
</section>

<section id="profilePage" class="page hidden">
<div class="card">
<h3>My Profile</h3>
<img id="profilePhoto" class="profile-photo hidden" alt="Profile picture">
<input id="profilePhotoInput" type="file" accept="image/*">
<input id="profileName" placeholder="Your name">
<input id="profileUsername" placeholder="Username">
<input id="profilePhone" placeholder="Phone number">
<textarea id="profileBio" maxlength="300" placeholder="Tell people about yourself"></textarea>
<button onclick="saveProfile()">Save Profile</button>
<p id="profileEmail" class="muted"></p>
</div>
</section>

<section id="notificationsPage" class="page hidden">
<div class="card">
<h3>Notifications</h3>
<div id="notificationList"></div>
</div>
</section>

</main>
</div>

<footer>CONNECT HUB · Connecting people worldwide</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
getFirestore,collection,doc,setDoc,getDoc,getDocs,addDoc,
deleteDoc,updateDoc,query,where,orderBy,onSnapshot,
serverTimestamp,limit
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

import {
getStorage,ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSyAMO8O4vh1nkKxxS2J1-EYtHCw0Sxg51Vk",
authDomain:"connect-hub-d183a.firebaseapp.com",
projectId:"connect-hub-d183a",
storageBucket:"connect-hub-d183a.firebasestorage.app",
messagingSenderId:"175835875152",
appId:"1:175835875152:web:5eece1581716a2854cce55",
measurementId:"G-HL4HPENGCT"
};

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getFirestore(appFirebase);
const storage=getStorage(appFirebase);
const provider=new GoogleAuthProvider();

let currentUser=null;
let activeChat=null;
let activeChatName="";
let stopMessages=null;
let peopleCache=[];
let friendCache=[];
let activeCommunity=null;

const $=id=>document.getElementById(id);

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const pairId=(a,b)=>[a,b].sort().join("_");

const initials=s=>(s||"U").trim().charAt(0).toUpperCase()||"U";

function avatar(p){
return `<div class="avatar">${
p?.photoURL?`<img src="${esc(p.photoURL)}" alt="">`:esc(initials(p?.displayName))
}</div>`;
}

function say(id,msg){
$(id).textContent=msg;
}

async function uploadPhoto(file,uid){
if(!file)return "";
if(!file.type.startsWith("image/"))throw Error("Choose an image file.");
if(file.size>5*1024*1024)throw Error("Image must be under 5 MB.");
const r=ref(storage,`profilePictures/${uid}/${Date.now()}`);
await uploadBytes(r,file);
return getDownloadURL(r);
}

async function profile(uid){
const s=await getDoc(doc(db,"users",uid));
return s.exists()?s.data():{uid,displayName:"Member"};
}

async function ensureProfile(user,name="",username="",phone="",photoURL=""){
const r=doc(db,"users",user.uid);
const s=await getDoc(r);

if(!s.exists()){
const clean=(username||"user_"+user.uid.slice(0,7))
.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,20);

await setDoc(r,{
uid:user.uid,
displayName:name||user.displayName||"New Member",
username:clean,
phone,
email:user.email||"",
photoURL:photoURL||user.photoURL||"",
bio:"",
createdAt:serverTimestamp()
});
}
}

async function notify(to,type,message,extra={}){
if(!to||to===currentUser.uid)return;
await addDoc(collection(db,"notifications"),{
to,from:currentUser.uid,type,message,extra,
createdAt:serverTimestamp(),read:false
});
}

// REGISTRATION
window.register=async()=>{
const name=$("nameInput").value.trim();
const username=$("usernameInput").value.trim().replace(/^@/,"").toLowerCase();
const phone=$("phoneInput").value.trim();
const email=$("emailInput").value.trim();
const password=$("passwordInput").value;
const file=$("photoInput").files[0];

if(!name||!username||!email||!password){
say("authMessage","Fill in your name, username, email and password.");
return;
}

if(!/^[a-z0-9_]{3,20}$/.test(username)){
say("authMessage","Username must be 3–20 letters, numbers or underscores.");
return;
}

if(password.length<6){
say("authMessage","Password must be at least 6 characters.");
return;
}

try{
say("authMessage","Creating account...");
const result=await createUserWithEmailAndPassword(auth,email,password);
let photoURL=file?await uploadPhoto(file,result.user.uid):"";

await updateProfile(result.user,{
displayName:name,
...(photoURL?{photoURL}:{})
});

await ensureProfile(result.user,name,username,phone,photoURL);
say("authMessage","Account created!");
}catch(e){
say("authMessage",e.message);
}
};

// LOGIN
window.login=async()=>{
try{
await signInWithEmailAndPassword(
auth,$("emailInput").value.trim(),$("passwordInput").value
);
}catch(e){
say("authMessage",e.message);
}
};

// GOOGLE LOGIN
window.googleLogin=async()=>{
try{
const r=await signInWithPopup(auth,provider);
await ensureProfile(r.user);
}catch(e){
say("authMessage",e.message);
}
};

// LOGOUT
window.logout=async()=>{
if(stopMessages)stopMessages();
stopMessages=null;
await signOut(auth);
};

// AUTH STATE
onAuthStateChanged(auth,async u=>{
currentUser=u;
$("authSection").classList.toggle("hidden",!!u);
$("app").classList.toggle("hidden",!u);
$("logoutBtn").classList.toggle("hidden",!u);

if(u){
try{
await ensureProfile(u);
await loadProfile();
await showPage("home");
}catch(e){
alert("Loading error: "+e.message);
}
}else{
if(stopMessages)stopMessages();
stopMessages=null;
}
});

// PAGE NAVIGATION
window.showPage=async page=>{
document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
$(page+"Page").classList.remove("hidden");

if(page!=="chat"&&stopMessages){
stopMessages();
stopMessages=null;
}

try{
if(page==="home")await loadFeed();
if(page==="discover")await loadPeople();
if(page==="requests")await loadRequests();
if(page==="friends")await loadFriends();
if(page==="chats")await loadChatContacts();
if(page==="communities")await loadCommunities();
if(page==="profile")await loadProfile();
if(page==="notifications")await loadNotifications();
}catch(e){
console.error(e);
alert(e.message);
}
};

// PROFILE
async function loadProfile(){
const p=await profile(currentUser.uid);
$("profileName").value=p.displayName||"";
$("profileUsername").value=p.username||"";
$("profilePhone").value=p.phone||"";
$("profileBio").value=p.bio||"";
$("profileEmail").textContent=currentUser.email||"";

if(p.photoURL){
$("profilePhoto").src=p.photoURL;
$("profilePhoto").classList.remove("hidden");
}else{
$("profilePhoto").classList.add("hidden");
}
}

window.saveProfile=async()=>{
const displayName=$("profileName").value.trim();
const username=$("profileUsername").value.trim().replace(/^@/,"").toLowerCase();
const phone=$("profilePhone").value.trim();
const bio=$("profileBio").value.trim();
const file=$("profilePhotoInput").files[0];

if(!displayName||!/^[a-z0-9_]{3,20}$/.test(username)){
return alert("Enter a name and valid username (3–20 letters, numbers or underscores).");
}

try{
const all=await getDocs(collection(db,"users"));

if(all.docs.some(x=>x.id!==currentUser.uid&&(x.data().username||"").toLowerCase()===username)){
return alert("Username already taken.");
}

const changes={displayName,username,phone,bio};

if(file){
changes.photoURL=await uploadPhoto(file,currentUser.uid);
}

await updateDoc(doc(db,"users",currentUser.uid),changes);

await updateProfile(currentUser,{
displayName,
...(changes.photoURL?{photoURL:changes.photoURL}:{})
});

await loadProfile();
alert("Profile saved.");
}catch(e){
alert(e.message);
}
};

// POSTS
window.createPost=async()=>{
const text=$("postInput").value.trim();
if(!text)return;

try{
await addDoc(collection(db,"posts"),{
uid:currentUser.uid,text,createdAt:serverTimestamp()
});
$("postInput").value="";
await loadFeed();
}catch(e){
alert(e.message);
}
};

async function loadFeed(){
const box=$("feed");
box.innerHTML='<p class="empty">Loading posts...</p>';

try{
const snap=await getDocs(query(
collection(db,"posts"),orderBy("createdAt","desc"),limit(50)
));

box.innerHTML="";

for(const post of snap.docs){
const d=post.data();
const p=await profile(d.uid);
const likes=await getDocs(collection(db,"posts",post.id,"likes"));

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="row">
${avatar(p)}
<div><b>${esc(p.displayName)}</b><br>
<small>@${esc(p.username||"member")}</small></div>
</div>
<div class="post">${esc(d.text)}</div>
<div class="actions">
<button class="like">Like (${likes.size})</button>
<button class="comment">Comments</button>
${d.uid===currentUser.uid?'<button class="delete">Delete</button>':""}
</div>
<div class="comments hidden"></div>`;

card.querySelector(".like").onclick=()=>toggleLike(post.id);

card.querySelector(".comment").onclick=()=>showComments(
post.id,card.querySelector(".comments")
);

if(d.uid===currentUser.uid){
card.querySelector(".delete").onclick=async()=>{
if(confirm("Delete this post?")){
await deleteDoc(doc(db,"posts",post.id));
loadFeed();
}
};
}

box.appendChild(card);
}

if(!snap.size){
box.innerHTML='<p class="empty">No posts yet. Be the first to post!</p>';
}
}catch(e){
box.innerHTML=`<p class="empty">Feed error: ${esc(e.message)}</p>`;
}
}

async function toggleLike(id){
try{
const r=doc(db,"posts",id,"likes",currentUser.uid);
const s=await getDoc(r);

if(s.exists())await deleteDoc(r);
else await setDoc(r,{uid:currentUser.uid,createdAt:serverTimestamp()});

await loadFeed();
}catch(e){
alert(e.message);
}
}

async function showComments(postId,box){
box.classList.toggle("hidden");
if(box.classList.contains("hidden"))return;

box.innerHTML="Loading comments...";

try{
const snap=await getDocs(query(
collection(db,"posts",postId,"comments"),orderBy("createdAt","asc")
));

box.innerHTML=`
<input class="commentText" maxlength="1000" placeholder="Write a comment...">
<button class="sendComment">Send Comment</button>
<div class="commentRows"></div>`;

for(const c of snap.docs){
const d=c.data();
const p=await profile(d.uid);
const el=document.createElement("p");
el.className="item";
el.textContent=(p.displayName||"Member")+": "+d.text;
box.querySelector(".commentRows").appendChild(el);
}

box.querySelector(".sendComment").onclick=async()=>{
const text=box.querySelector(".commentText").value.trim();
if(!text)return;

try{
await addDoc(collection(db,"posts",postId,"comments"),{
uid:currentUser.uid,text,createdAt:serverTimestamp()
});
showComments(postId,box);
}catch(e){
alert(e.message);
}
};
}catch(e){
box.textContent=e.message;
}
}

// DISCOVER PEOPLE
async function loadPeople(){
const snap=await getDocs(collection(db,"users"));
peopleCache=snap.docs.map(x=>x.data()).filter(p=>p.uid!==currentUser.uid);
renderPeople(peopleCache);
}

window.searchPeople=()=>{
const t=$("searchInput").value.toLowerCase().trim();

renderPeople(peopleCache.filter(p=>
(p.displayName||"").toLowerCase().includes(t)||
(p.username||"").toLowerCase().includes(t)
));
};

function renderPeople(list){
const box=$("peopleList");
box.innerHTML="";

if(!list.length){
box.innerHTML='<p class="empty">No people found.</p>';
return;
}

list.forEach(p=>{
const el=document.createElement("div");
el.className="item";

el.innerHTML=`
<div class="row">
${avatar(p)}
<div><b>${esc(p.displayName)}</b><br>
<small>@${esc(p.username||"member")}</small></div>
<button>Connect</button>
</div>`;

el.querySelector("button").onclick=()=>sendRequest(p.uid);
box.appendChild(el);
});
}

// FRIEND REQUESTS
window.sendRequest=async uid=>{
try{
const id=currentUser.uid+"_"+uid;
const r=doc(db,"friendRequests",id);
const old=await getDoc(r);

if(old.exists())return alert("Request already exists.");

await setDoc(r,{
senderUid:currentUser.uid,
receiverUid:uid,
status:"pending",
createdAt:serverTimestamp()
});

try{
await notify(uid,"friend_request","You received a friend request.");
}catch(e){
console.warn("Notification failed:",e);
}

alert("Friend request sent.");
}catch(e){
alert(e.message);
}
};

async function loadRequests(){
const box=$("requestList");
box.innerHTML="Loading...";

try{
const snap=await getDocs(query(
collection(db,"friendRequests"),
where("receiverUid","==",currentUser.uid),
where("status","==","pending")
));

box.innerHTML="";

for(const r of snap.docs){
const d=r.data();
const p=await profile(d.senderUid);
const el=document.createElement("div");
el.className="item";

el.innerHTML=`
<b>${esc(p.displayName)}</b>
<small>@${esc(p.username||"member")}</small>
<div class="actions">
<button class="yes">Accept</button>
<button class="no secondary">Decline</button>
</div>`;

el.querySelector(".yes").onclick=async()=>{
try{
await updateDoc(doc(db,"friendRequests",r.id),{
status:"accepted"
});
try{
await notify(d.senderUid,"friend_accepted","Your friend request was accepted.");
}catch(e){
console.warn(e);
}
loadRequests();
}catch(e){
alert(e.message);
}
};

el.querySelector(".no").onclick=async()=>{
try{
await deleteDoc(doc(db,"friendRequests",r.id));
loadRequests();
}catch(e){
alert(e.message);
}
};

box.appendChild(el);
}

if(!snap.size){
box.innerHTML='<p class="empty">No pending requests.</p>';
}
}catch(e){
box.textContent=e.message;
}
}

async function getFriendIds(){
const a=await getDocs(query(
collection(db,"friendRequests"),
where("senderUid","==",currentUser.uid),
where("status","==","accepted")
));

const b=await getDocs(query(
collection(db,"friendRequests"),
where("receiverUid","==",currentUser.uid),
where("status","==","accepted")
));

return [...new Set([
...a.docs.map(x=>x.data().receiverUid),
...b.docs.map(x=>x.data().senderUid)
])];
}

// FRIENDS
async function loadFriends(){
const box=$("friendsList");
box.innerHTML="Loading...";

try{
const ids=await getFriendIds();
friendCache=[];

for(const uid of ids){
friendCache.push(await profile(uid));
}

box.innerHTML="";

friendCache.forEach(p=>{
const el=document.createElement("div");
el.className="item";

el.innerHTML=`
<div class="row">
${avatar(p)}
<div><b>${esc(p.displayName)}</b><br>
<small>@${esc(p.username||"member")}</small></div>
<button>Message</button>
</div>`;

el.querySelector("button").onclick=()=>openChat(p.uid,p.displayName);
box.appendChild(el);
});

if(!ids.length){
box.innerHTML='<p class="empty">Add friends to start chatting.</p>';
}
}catch(e){
box.textContent=e.message;
}
}

// =================================
// CONNECT HUB PRIVATE CHAT SYSTEM
// =================================

// OPEN CHAT
window.openChat=async(uid,name)=>{
if(!currentUser||!uid||uid===currentUser.uid)return;

activeChat=pairId(currentUser.uid,uid);
activeChatName=name||"Chat";

$("chatTitle").textContent=activeChatName;
$("messages").textContent="Opening chat...";

try{
await setDoc(doc(db,"chats",activeChat),{
participants:[currentUser.uid,uid].sort(),
updatedAt:serverTimestamp()
},{merge:true});

await showPage("chat");
startMessages();

}catch(e){
$("messages").textContent="Could not open chat: "+e.message;
}
};

// LOAD MESSAGES IN REAL TIME
function startMessages(){
if(stopMessages)stopMessages();

const q=query(
collection(db,"chats",activeChat,"messages"),
orderBy("createdAt","asc"),
limit(100)
);

stopMessages=onSnapshot(q,snap=>{
const box=$("messages");
box.innerHTML="";

if(snap.empty){
box.innerHTML='<p class="empty">No messages yet. Say hello!</p>';
}

snap.forEach(x=>{
const d=x.data();
const el=document.createElement("div");

el.className="message"+
(d.senderUid===currentUser.uid?" mine":"");

el.textContent=d.text||"";
box.appendChild(el);
});

box.scrollTop=box.scrollHeight;

},e=>{
$("messages").textContent="Chat error: "+e.message;
});
}

// SEND MESSAGE
window.sendMessage=async()=>{
const text=$("messageInput").value.trim();

if(!text||!activeChat||!currentUser)return;

const parts=activeChat.split("_");
const friendId=parts.find(x=>x!==currentUser.uid);

try{
await setDoc(doc(db,"chats",activeChat),{
participants:parts.sort(),
updatedAt:serverTimestamp(),
lastMessage:text
},{merge:true});

await addDoc(collection(db,"chats",activeChat,"messages"),{
senderUid:currentUser.uid,
text,
createdAt:serverTimestamp()
});

$("messageInput").value="";

if(friendId){
notify(friendId,"message","You received a new message.")
.catch(err=>console.warn("Notification failed:",err));
}

}catch(e){
alert("Message error: "+e.message);
}
};

// LOAD CHAT CONTACTS
async function loadChatContacts(){
const box=$("chatContacts");
box.innerHTML="Loading friends...";

try{
const ids=await getFriendIds();

box.innerHTML="";

if(!ids.length){
box.innerHTML='<p class="empty">You have no friends yet. Accept or send a friend request first.</p>';
return;
}

for(const uid of ids){
const p=await profile(uid);
const el=document.createElement("div");
el.className="item";

el.innerHTML=`
<div class="row">
${avatar(p)}
<div><b>${esc(p.displayName||"Member")}</b><br>
<small>@${esc(p.username||"member")}</small></div>
<button>Open Chat</button>
</div>`;

el.querySelector("button").onclick=()=>openChat(uid,p.displayName);

box.appendChild(el);
}

}catch(e){
box.textContent="Could not load chats: "+e.message;
}
}

// COMMUNITIES
window.createCommunity=async()=>{
const name=$("communityName").value.trim();
const description=$("communityDescription").value.trim();

if(!name)return alert("Enter a community name.");

try{
const r=await addDoc(collection(db,"communities"),{
name,description,ownerUid:currentUser.uid,createdAt:serverTimestamp()
});

await setDoc(doc(db,"communities",r.id,"members",currentUser.uid),{
uid:currentUser.uid,joinedAt:serverTimestamp()
});

$("communityName").value="";
$("communityDescription").value="";

alert("Community created.");
loadCommunities();

}catch(e){
alert(e.message);
}
};

async function loadCommunities(){
const box=$("communityList");
box.innerHTML="Loading...";

try{
const snap=await getDocs(query(
collection(db,"communities"),
orderBy("createdAt","desc"),
limit(100)
));

box.innerHTML="";

snap.forEach(d=>{
const c=d.data();
const el=document.createElement("div");
el.className="item";

el.innerHTML=`
<b>${esc(c.name)}</b>
<p class="muted">${esc(c.description||"")}</p>
<div class="actions"><button>Open community</button></div>`;

el.querySelector("button").onclick=()=>openCommunity(d.id,c);
box.appendChild(el);
});

if(!snap.size){
box.innerHTML='<p class="empty">No communities yet. Create one!</p>';
}

}catch(e){
box.textContent=e.message;
}
}

async function openCommunity(id,c){
activeCommunity=id;

$("communityTitle").textContent=c.name;
$("communityAbout").textContent=c.description||"";

await showPage("community");

const memberRef=doc(db,"communities",id,"members",currentUser.uid);
const member=await getDoc(memberRef);

$("communityControls").innerHTML="";

if(!member.exists()){
const b=document.createElement("button");
b.textContent="Join Community";

b.onclick=async()=>{
try{
await setDoc(memberRef,{
uid:currentUser.uid,joinedAt:serverTimestamp()
});
openCommunity(id,c);
}catch(e){
alert(e.message);
}
};

$("communityControls").appendChild(b);
$("communityComposer").classList.add("hidden");

}else{
$("communityComposer").classList.remove("hidden");

const b=document.createElement("button");
b.className="secondary";
b.textContent="Leave Community";

b.onclick=async()=>{
try{
await deleteDoc(memberRef);
openCommunity(id,c);
}catch(e){
alert(e.message);
}
};

$("communityControls").appendChild(b);
}

await loadCommunityPosts();
}

async function loadCommunityPosts(){
const box=$("communityPosts");
box.innerHTML='<div class="card">Loading posts...</div>';

try{
const snap=await getDocs(query(
collection(db,"communities",activeCommunity,"posts"),
orderBy("createdAt","desc"),
limit(50)
));

box.innerHTML="";

for(const d of snap.docs){
const x=d.data();
const p=await profile(x.uid);
const el=document.createElement("div");

el.className="card";
el.innerHTML=`
<b>${esc(p.displayName)}</b>
<p class="post">${esc(x.text)}</p>
<small>${x.createdAt?.toDate?.().toLocaleString?.()||""}</small>`;

box.appendChild(el);
}

if(!snap.size){
box.innerHTML='<div class="card empty">No community posts yet.</div>';
}

}catch(e){
box.innerHTML=`<div class="card">${esc(e.message)}</div>`;
}
}

window.sendCommunityPost=async()=>{
const text=$("communityPostInput").value.trim();

if(!text||!activeCommunity)return;

try{
const member=await getDoc(doc(
db,"communities",activeCommunity,"members",currentUser.uid
));

if(!member.exists())return alert("Join this community first.");

await addDoc(collection(
db,"communities",activeCommunity,"posts"
),{
uid:currentUser.uid,
text,
createdAt:serverTimestamp()
});

$("communityPostInput").value="";
loadCommunityPosts();

}catch(e){
alert(e.message);
}
};

// NOTIFICATIONS
async function loadNotifications(){
const box=$("notificationList");
box.innerHTML="Loading...";

try{
const snap=await getDocs(query(
collection(db,"notifications"),
where("to","==",currentUser.uid),
orderBy("createdAt","desc"),
limit(50)
));

box.innerHTML="";

snap.forEach(d=>{
const x=d.data();
const el=document.createElement("div");

el.className="item";
el.textContent=x.message||x.type||"Notification";
box.appendChild(el);

if(!x.read){
updateDoc(doc(db,"notifications",d.id),{read:true}).catch(()=>{});
}
});

if(!snap.size){
box.innerHTML='<p class="empty">No notifications yet.</p>';
}

}catch(e){
box.textContent="Notification error: "+e.message;
}
}

</script>
